name: (Docker Action) Publish (amd64/arm64)

on:
  # schedule:
  #   - cron: '34 8 * * *'
  push:
    branches: [ main ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  # This concurrency group ensures that only one job in the group runs at a time.
  # If a new job is triggered, the previous one will be canceled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signing attestations, cache entries with GitHub OIDC and log in to Google Artifact Registry
    with:
      cache: true
      output: image
      platforms: linux/amd64,linux/arm64
      push: ${{ github.event_name != 'pull_request' }}
      meta-images: |
        ${{ vars.SHARED_WIF_LOCATION }}-docker.pkg.dev/${{ vars.SHARED_WIF_PROJECT }}/${{ vars.SHARED_WIF_REPO }}/${{ github.event.repository.name }}
      meta-annotations: |
        type=org.opencontainers.image.description,value=${{ github.event.repository.description || 'No description provided' }}
      meta-tags: |
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
      registry-identities: |
        - type: gcp-wif
          registry: ${{ vars.SHARED_WIF_LOCATION }}-docker.pkg.dev
          workload_identity_provider: ${{ vars.SHARED_WIF_PROVIDER }}
          service_account: ${{ vars.SHARED_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.SHARED_WIF_PROJECT }}
      set-meta-annotations: true
      set-meta-labels: true